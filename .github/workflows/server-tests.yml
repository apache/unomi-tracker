name: Server Tests

# The tracker in a real browser against each supported Unomi version (test/servers).
# Each job is a required check for merging into main (.asf.yaml): keep the job names in sync.
on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-tests:
    name: server-tests (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [compare-1.5.0, unomi2-legacy, unomi2, unomi3, unomi4, unomi4-compat]
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        shell: bash
        run: yarn install --frozen-lockfile
      - name: Install Chromium
        shell: bash
        run: npx playwright install --with-deps chromium
      - name: Run the tests
        shell: bash
        run: yarn test:servers ${{ matrix.target }}
      - name: Upload the test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.target }}
          path: test/servers/test-results/
          retention-days: 7
