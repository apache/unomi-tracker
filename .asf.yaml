github:
  rulesets:
    - name: "Default Branch Protection"
      type: branch
      branches:
        includes:
          - "~DEFAULT_BRANCH"
          - "release/*"
          - "rel/*"
        excludes: []
      bypass_teams:
        - root
      restrict_deletion: true
      restrict_force_push: true
      # Job names from .github/workflows (not validated: a wrong name blocks every merge)
      required_status_checks:
        - "lint-tests"
        - "build"
        - "server-tests (unomi3)"
        - "server-tests (unomi3, firefox)"
        - "server-tests (unomi3, webkit)"
        - "server-tests (unomi4)"
        - "server-tests (unomi4, firefox)"
        - "server-tests (unomi4, webkit)"
