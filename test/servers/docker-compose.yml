# Unomi servers for the tracker compatibility tests. Run them through
# `yarn test:servers`, which starts one profile at a time on port 8181.
# Each profile can also be started by hand, for example:
#   docker compose -f test/servers/docker-compose.yml --profile unomi4 up -d

x-elasticsearch: &elasticsearch
  environment:
    - discovery.type=single-node
    - xpack.security.enabled=false
    - cluster.name=contextElasticSearch
    - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
  healthcheck:
    test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
    interval: 5s
    timeout: 5s
    retries: 60

services:
  elasticsearch7:
    <<: *elasticsearch
    image: docker.elastic.co/elasticsearch/elasticsearch:${ES7_VERSION:-7.17.28}
    profiles: ["unomi2"]

  elasticsearch9-1:
    <<: *elasticsearch
    image: docker.elastic.co/elasticsearch/elasticsearch:${ES9_1_VERSION:-9.1.3}
    profiles: ["unomi3"]

  elasticsearch9-4:
    <<: *elasticsearch
    image: docker.elastic.co/elasticsearch/elasticsearch:${ES9_4_VERSION:-9.4.3}
    profiles: ["unomi4", "unomi4-compat"]

  unomi2:
    image: apache/unomi:${UNOMI2_VERSION:-2.7.0}
    profiles: ["unomi2"]
    environment:
      - UNOMI_ELASTICSEARCH_ADDRESSES=elasticsearch7:9200
    ports:
      - "${UNOMI_PORT:-8181}:8181"
    depends_on:
      elasticsearch7:
        condition: service_healthy

  unomi3:
    image: apache/unomi:${UNOMI3_VERSION:-3.0.0}
    profiles: ["unomi3"]
    environment:
      - UNOMI_ELASTICSEARCH_ADDRESSES=elasticsearch9-1:9200
    ports:
      - "${UNOMI_PORT:-8181}:8181"
    depends_on:
      elasticsearch9-1:
        condition: service_healthy

  unomi4: &unomi4
    image: apache/unomi:${UNOMI4_VERSION:-4.0.0-SNAPSHOT}
    profiles: ["unomi4"]
    environment:
      - UNOMI_AUTO_START=true
      - UNOMI_DISTRIBUTION=unomi-distribution-elasticsearch
      - UNOMI_ELASTICSEARCH_ADDRESSES=elasticsearch9-4:9200
      - UNOMI_ROOT_PASSWORD=${UNOMI_ROOT_PASSWORD:-tracker-test-root}
      - UNOMI_HEALTHCHECK_PASSWORD=${UNOMI_HEALTHCHECK_PASSWORD:-tracker-test-health}
      # The test page origin may send cookies. The second test origin is left out on purpose.
      - UNOMI_PUBLIC_CORS_ALLOWED_ORIGINS=http://localhost:8000
    ports:
      - "${UNOMI_PORT:-8181}:8181"
    depends_on:
      elasticsearch9-4:
        condition: service_healthy

  unomi4-compat:
    <<: *unomi4
    profiles: ["unomi4-compat"]
    environment:
      - UNOMI_AUTO_START=true
      - UNOMI_DISTRIBUTION=unomi-distribution-elasticsearch
      - UNOMI_ELASTICSEARCH_ADDRESSES=elasticsearch9-4:9200
      - UNOMI_ROOT_PASSWORD=${UNOMI_ROOT_PASSWORD:-tracker-test-root}
      - UNOMI_HEALTHCHECK_PASSWORD=${UNOMI_HEALTHCHECK_PASSWORD:-tracker-test-health}
      - UNOMI_PUBLIC_CORS_ALLOWED_ORIGINS=http://localhost:8000
      - UNOMI_REST_AUTHENTICATION_SINGLETENANTCOMPATIBILITYMODEENABLED=true
